[project]
name = "settlement"
version = "0.1.0"
description = "Agent-Society v2: durable investigation system, S0-S3"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "uvicorn>=0.30",
  "dbos>=3.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# tests/_heavy_archived holds 85 files that spawn real child processes.
# Running them together saturates the host, so a default collection skips
# them. Run them deliberately, one file at a time; see the README there.
norecursedirs = ["tests/_heavy_archived", ".worktrees", ".*", "build", "dist", "node_modules", "venv"]

[tool.ruff]
line-length = 100
