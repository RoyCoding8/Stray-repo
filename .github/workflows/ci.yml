name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (db, shard ${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Two sharded jobs carrying PostgreSQL, and nothing else. The previous
      # matrix ran the whole suite seven times: three unsharded jobs on 3.12,
      # 3.13 and 3.14 each ran every test, and four sharded jobs on 3.13 ran
      # them again in quarters, so 3.13's suite executed twice over identical
      # code paths and 3.12 and 3.14 repeated both. Wall clock bought no
      # additional claim.
      #
      # One Python, pinned. `pyproject.toml` declares `requires-python >=3.12`,
      # so 3.13 is inside the declared range and a version axis is not where
      # a regression would first appear. Cross-OS coverage is below, where it
      # is currently absent entirely -- every job here was ubuntu, which is
      # what kept the suite tied to WSL.
      matrix:
        include:
          - { token: "b31300a1", group: "1" }
          - { token: "b31300a2", group: "2" }
    timeout-minutes: 100

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      S09ISO_TOKEN: ${{ matrix.token }}
      SETTLEMENT_TEST_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres
      S09ISO_ADMIN_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          # Three tests read a pinned path out of the history with
          # `git cat-file blob <sha>:<path>`. The SHAs sit 180 to 201 commits
          # behind the tip, so the depth-1 default clone does not carry them
          # and `cat-file` exits 128 on a name it has never heard of. Run
          # 37261826154 failed 7 on exactly this. The commit itself is enough;
          # the history is what the tests ask for.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # uv replaces the pip resolver in every job. `--system` is load-bearing:
      # setup-python provides a bare interpreter with no venv, and a bare
      # `uv pip install` refuses it ("No virtual environment found", run
      # 37384577025) while `--system` matches what pip did. There is no uv
      # lockfile: `uv sync` would want one and would pin `requires-python`
      # to whatever it resolved, so the resolver stays unpinned on purpose.
      # Install is the longest setup step on windows/macos runners; its
      # before/after is the measurement this swap answers for.
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install the client the service can be dumped by
        uses: ./.github/actions/postgres-client
        with:
          major: "18"

      - name: Install
        run: |
          uv pip install --system -e ".[test]"
          uv pip install --system pytest-split

      - name: Collect
        run: |
          python -m pytest --collect-only -q > collect.log 2>&1
          tail -3 collect.log

      - name: Suite
        # Exit code is pytest's, never a pipe's. `pytest | tail` returns tail's
        # status, and an INTERNALERROR at collection then reads as a green run
        # with zero tests executed.
        #
        # The full log is the record; the console only shows a bounded slice.
        # Deriving "my file is absent from the failures" from a tail is
        # unsound - a py3.12 run reported 65 failed and kept 16 FAILED lines,
        # a 3.13 shard reported 23 failed and kept 2. Every count read off the
        # console is a floor, so the artifact below is what counts.
        #
        # Always sharded. The unsharded branch is gone because every job in
        # this matrix is a shard: an `if [ -n "$group" ]` that cannot take
        # its other branch is a second way to describe the same job, and the
        # last time the matrix carried an empty group it ran the entire suite
        # three more times.
        run: |
          rc=0
          python -m pytest -q -p no:cacheprovider \
            --splits 2 --group ${{ matrix.group }} > suite.log 2>&1 || rc=$?
          grep -E '^(FAILED|ERROR)' suite.log | sort -u > failures.txt || true
          echo "distinct failure lines: $(wc -l < failures.txt)"
          head -150 failures.txt
          echo "--- tail of suite.log ---"
          tail -25 suite.log
          exit $rc

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-db-${{ matrix.group }}
          path: |
            suite.log
            failures.txt
          retention-days: 14

  port:
    name: suite (portable, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    # The suite has only ever run on ubuntu, and that is what kept it tied to a
    # WSL host for the 21 files that touch POSIX-only APIs and for everything
    # else that a Windows checkout would exercise differently. This job is the
    # cross-OS claim, and it is cheap because it does not need a database.
    #
    # No SETTLEMENT_TEST_DSN is set, deliberately. The isolation plugin's
    # configure gate steps aside on an empty route (nothing is created, no
    # claim is taken), and every test that needs a database refuses or skips
    # on its own missing route instead of erroring against a socket it never
    # had. Before the DSN authority was single, these jobs measured that
    # defect: 554 lines connecting on hardcoded `host=/var/run/postgresql`
    # routes (run 37367150028). No file list is maintained here: a second
    # list is a second authority on which tests need a database, and the
    # tree already answers the question itself.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    # Every step below is bash, and on windows-latest a `run:` without an
    # explicit shell is pwsh: run 37365655000 died there with "The '<'
    # operator is reserved for future use" before producing any log. Git Bash
    # ships on every GitHub runner, so one job-level default covers all three
    # OSes and the steps stay free of per-step shell noise.
    defaults:
      run:
        shell: bash

    env:
      PYTHONPATH: src
      # No token and no DSN. The plugin's configure gate returns on the
      # empty route, so this job takes no lock and creates nothing; with a
      # token and a DSN it would claim a per-token advisory lock and create
      # a disposable database on a runner with no PostgreSQL. Routeless, the
      # session skips everything that needs a database -- which is the
      # claim this job makes about portability.

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the same pinned-history reads as the suite job

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install
        run: |
          uv pip install --system -e ".[test]"

      - name: Collect
        run: |
          python -m pytest --collect-only -q > collect.log 2>&1
          tail -3 collect.log

      - name: Suite
        run: |
          rc=0
          python -m pytest -q -p no:cacheprovider > suite.log 2>&1 || rc=$?
          grep -E '^(FAILED|ERROR)' suite.log | sort -u > failures.txt || true
          echo "distinct failure lines: $(wc -l < failures.txt)"
          head -100 failures.txt
          echo "--- tail of suite.log ---"
          tail -25 suite.log
          exit $rc

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-port-${{ matrix.os }}
          path: |
            suite.log
            failures.txt
          retention-days: 14

  heavy:
    name: heavy archived
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Independent of the suite on purpose. Under `needs: [suite]` this job
    # reported `skipped` for every red suite run, so the 25 archived files had
    # never executed in CI and nothing here had ever been checked.

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      S09ISO_TOKEN: "b7ea1701"
      SETTLEMENT_TEST_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres
      S09ISO_ADMIN_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # same pinned-history reads as the matrix job above

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Six of the 85 archived files drive checkpoint or restore, so this job
      # needs the client for the same reason the matrix does: run 37305881683
      # recorded seven pg_dump version-mismatch failures here and nothing in
      # this job could produce them on purpose. One action, two call sites.
      - name: Install the client the service can be dumped by
        uses: ./.github/actions/postgres-client
        with:
          major: "18"

      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install
        run: |
          uv pip install --system -e ".[test]"
          uv pip install --system pytest-split

      - name: Heavy archived, one file at a time
        # `exit` belongs after the loop, not inside it: inside, the first
        # failure ended the job green and the remaining 24 files never ran.
        run: |
          rc=0
          : > heavy-failures.txt
          : > heavy-tracebacks.log
          for f in tests/_heavy_archived/test_*.py; do
            echo "=== $f"
            # No -q. It suppresses the FAILURES block, so a failing file left
            # only its summary line and no traceback body: 60 of the 247 IDs in
            # run 37261826154 could not be rooted from any artifact for that
            # reason alone. Full output is redirected either way, so the console
            # stays the same shape.
            if python -m pytest -p no:cacheprovider "$f" > heavy.log 2>&1; then
              tail -2 heavy.log
            else
              rc=1
              echo "=== $f FAILED" | tee -a heavy-failures.txt
              grep -E '^(FAILED|ERROR)' heavy.log | sort -u | tee -a heavy-failures.txt
              # Keep only the failing files' bodies, and keep them all: one
              # heavy.log is overwritten per iteration, so archiving it alone
              # would retain the last file and lose every earlier one.
              { echo "=== $f"; cat heavy.log; } >> heavy-tracebacks.log
              tail -30 heavy.log
            fi
          done
          echo "files run: $(ls tests/_heavy_archived/test_*.py | wc -l)"
          echo "files failing: $(grep -c 'FAILED$' heavy-failures.txt || true)"
          recorded=$(grep -cE '^(=== .* FAILED|FAILED|ERROR)' heavy-failures.txt || true)
          echo "recorded failure lines: $recorded"
          if [ "$recorded" -gt 0 ]; then
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            test -s heavy.log || { echo "::error::no archived file produced a result"; rc=1; }
          fi
          exit $rc

      - name: Upload heavy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-archived
          path: |
            heavy-failures.txt
            heavy-tracebacks.log
          retention-days: 14

  consistency:
    name: line endings and migration currency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: tests/ must be LF on Linux
        run: |
          # A CRLF file in tests/ is invisible on Windows and breaks exact
          # matching on Linux. Counted, not asserted per file.
          crlf=$(git ls-files 'tests/*.py' | xargs grep -lU $'\r' 2>/dev/null | wc -l)
          echo "tests/ files containing CR: $crlf"
          if [ "$crlf" != "0" ]; then
            echo "::error::CRLF line endings in tests/ break byte-exact needles on Linux"
            exit 1
          fi

      - name: migration files are LF
        run: |
          crlf=$(git ls-files 'migrations/*.sql' | xargs grep -lU $'\r' 2>/dev/null | wc -l)
          echo "migrations/ files containing CR: $crlf"
          [ "$crlf" = "0" ]

      - name: authority guards
        # Both are pure AST analysis over the tracked tree and import nothing
        # from the package, so they need no database and no PostgreSQL service.
        #
        # Each guard's stdout is the whole record: it prints one line per
        # examined file with its call and violation counts. A console tail of
        # that is what makes an exit-0-having-matched-nothing visible, so the
        # full log is uploaded rather than only shown. rc accumulates across
        # both so the first non-zero does not skip the second guard's output.
        run: |
          rc=0
          : > authority.log
          for g in tests/check_e2_authority.py tests/check_execution_authority.py; do
            echo "=== $g" | tee -a authority.log
            one=0
            python "$g" > authority-one.log 2>&1 || one=$?
            if [ "$one" -ne 0 ]; then
              rc=1
              echo "=== $g FAILED (exit $one)" | tee -a authority.log
            fi
            cat authority-one.log | tee -a authority.log
            # An exit 0 that examined nothing is the failure mode these guards
            # exist to prevent, so require a summary carrying a non-zero call
            # count. The two print different shapes ("26 target calls," versus
            # "tests/x.py: 43 calls,"), so scan back from "calls," for the
            # nearest count rather than matching either format. tr -d '\r'
            # because a Windows checkout makes the guards emit CRLF on stdout.
            if ! tr -d '\r' < authority-one.log \
                 | awk '/calls,/ { for (i = 1; i <= NF; i++)
                       if ($i ~ /calls,$/)
                         for (j = i - 1; j >= 1; j--)
                           if ($j ~ /^[0-9]+$/) { if ($j + 0 > 0) found = 1; break }
                     } END { exit !found }'; then
              echo "::error::$g reported no non-zero call count; it examined nothing"
              rc=1
            fi
          done
          cat authority.log
          exit $rc

      - name: Upload authority log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-guards
          path: authority.log
          retention-days: 14