name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: suite (py${{ matrix.python }}${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One axis, fully enumerated. A `python-version` axis plus `include`
      # entries multiplies them, and GitHub substitutes a missing key to the
      # empty string before the shell runs - which produced a literal
      # `--splits 4 --group ` and silently ran the whole suite unsharded.
      matrix:
        include:
          - { python: "3.12", token: "b3120000", group: "" }
          - { python: "3.13", token: "b3130000", group: "" }
          - { python: "3.14", token: "b3140000", group: "" }
          - { python: "3.13", token: "b31300a1", group: "1" }
          - { python: "3.13", token: "b31300a2", group: "2" }
          - { python: "3.13", token: "b31300a3", group: "3" }
          - { python: "3.13", token: "b31300a4", group: "4" }
    timeout-minutes: 100

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      S09ISO_TOKEN: ${{ matrix.token }}
      SETTLEMENT_TEST_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres
      S09ISO_ADMIN_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          # Three tests read a pinned path out of the history with
          # `git cat-file blob <sha>:<path>`. The SHAs sit 180 to 201 commits
          # behind the tip, so the depth-1 default clone does not carry them
          # and `cat-file` exits 128 on a name it has never heard of. Run
          # 37261826154 failed 7 on exactly this. The commit itself is enough;
          # the history is what the tests ask for.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the client the service can be dumped by
        uses: ./.github/actions/postgres-client
        with:
          major: "18"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest-split

      - name: Collect
        run: |
          python -m pytest --collect-only -q > collect.log 2>&1
          tail -3 collect.log

      - name: Suite
        # Exit code is pytest's, never a pipe's. `pytest | tail` returns tail's
        # status, and an INTERNALERROR at collection then reads as a green run
        # with zero tests executed.
        #
        # The full log is the record; the console only shows a bounded slice.
        # Deriving "my file is absent from the failures" from a tail is
        # unsound - a py3.12 run reported 65 failed and kept 16 FAILED lines,
        # a 3.13 shard reported 23 failed and kept 2. Every count read off the
        # console is a floor, so the artifact below is what counts.
        run: |
          if [ -n "${{ matrix.group }}" ]; then
            args="--splits 4 --group ${{ matrix.group }}"
          else
            args=""
          fi
          rc=0
          python -m pytest -q -p no:cacheprovider $args > suite.log 2>&1 || rc=$?
          grep -E '^(FAILED|ERROR)' suite.log | sort -u > failures.txt || true
          echo "distinct failure lines: $(wc -l < failures.txt)"
          head -150 failures.txt
          echo "--- tail of suite.log ---"
          tail -25 suite.log
          exit $rc

      - name: Upload suite log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-py${{ matrix.python }}-${{ matrix.group }}
          path: |
            suite.log
            failures.txt
          retention-days: 14

  heavy:
    name: heavy archived
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Independent of the suite on purpose. Under `needs: [suite]` this job
    # reported `skipped` for every red suite run, so the 25 archived files had
    # never executed in CI and nothing here had ever been checked.

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: src
      S09ISO_TOKEN: "b7ea1701"
      SETTLEMENT_TEST_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres
      S09ISO_ADMIN_DSN: dbname=postgres host=127.0.0.1 port=5432 user=postgres

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # same pinned-history reads as the matrix job above

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # Six of the 85 archived files drive checkpoint or restore, so this job
      # needs the client for the same reason the matrix does: run 37305881683
      # recorded seven pg_dump version-mismatch failures here and nothing in
      # this job could produce them on purpose. One action, two call sites.
      - name: Install the client the service can be dumped by
        uses: ./.github/actions/postgres-client
        with:
          major: "18"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          pip install pytest-split

      - name: Heavy archived, one file at a time
        # `exit` belongs after the loop, not inside it: inside, the first
        # failure ended the job green and the remaining 24 files never ran.
        run: |
          rc=0
          : > heavy-failures.txt
          : > heavy-tracebacks.log
          for f in tests/_heavy_archived/test_*.py; do
            echo "=== $f"
            # No -q. It suppresses the FAILURES block, so a failing file left
            # only its summary line and no traceback body: 60 of the 247 IDs in
            # run 37261826154 could not be rooted from any artifact for that
            # reason alone. Full output is redirected either way, so the console
            # stays the same shape.
            if python -m pytest -p no:cacheprovider "$f" > heavy.log 2>&1; then
              tail -2 heavy.log
            else
              rc=1
              echo "=== $f FAILED" | tee -a heavy-failures.txt
              grep -E '^(FAILED|ERROR)' heavy.log | sort -u | tee -a heavy-failures.txt
              # Keep only the failing files' bodies, and keep them all: one
              # heavy.log is overwritten per iteration, so archiving it alone
              # would retain the last file and lose every earlier one.
              { echo "=== $f"; cat heavy.log; } >> heavy-tracebacks.log
              tail -30 heavy.log
            fi
          done
          echo "files run: $(ls tests/_heavy_archived/test_*.py | wc -l)"
          echo "files failing: $(grep -c 'FAILED$' heavy-failures.txt || true)"
          recorded=$(grep -cE '^(=== .* FAILED|FAILED|ERROR)' heavy-failures.txt || true)
          echo "recorded failure lines: $recorded"
          if [ "$recorded" -gt 0 ]; then
            rc=1
          fi
          if [ "$rc" -eq 0 ]; then
            test -s heavy.log || { echo "::error::no archived file produced a result"; rc=1; }
          fi
          exit $rc

      - name: Upload heavy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heavy-archived
          path: |
            heavy-failures.txt
            heavy-tracebacks.log
          retention-days: 14

  consistency:
    name: line endings and migration currency
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: tests/ must be LF on Linux
        run: |
          # A CRLF file in tests/ is invisible on Windows and breaks exact
          # matching on Linux. Counted, not asserted per file.
          crlf=$(git ls-files 'tests/*.py' | xargs grep -lU $'\r' 2>/dev/null | wc -l)
          echo "tests/ files containing CR: $crlf"
          if [ "$crlf" != "0" ]; then
            echo "::error::CRLF line endings in tests/ break byte-exact needles on Linux"
            exit 1
          fi

      - name: migration files are LF
        run: |
          crlf=$(git ls-files 'migrations/*.sql' | xargs grep -lU $'\r' 2>/dev/null | wc -l)
          echo "migrations/ files containing CR: $crlf"
          [ "$crlf" = "0" ]

      - name: authority guards
        # Both are pure AST analysis over the tracked tree and import nothing
        # from the package, so they need no database and no PostgreSQL service.
        #
        # Each guard's stdout is the whole record: it prints one line per
        # examined file with its call and violation counts. A console tail of
        # that is what makes an exit-0-having-matched-nothing visible, so the
        # full log is uploaded rather than only shown. rc accumulates across
        # both so the first non-zero does not skip the second guard's output.
        run: |
          rc=0
          : > authority.log
          for g in tests/check_e2_authority.py tests/check_execution_authority.py; do
            echo "=== $g" | tee -a authority.log
            one=0
            python "$g" > authority-one.log 2>&1 || one=$?
            if [ "$one" -ne 0 ]; then
              rc=1
              echo "=== $g FAILED (exit $one)" | tee -a authority.log
            fi
            cat authority-one.log | tee -a authority.log
            # An exit 0 that examined nothing is the failure mode these guards
            # exist to prevent, so require a summary carrying a non-zero call
            # count. The two print different shapes ("26 target calls," versus
            # "tests/x.py: 43 calls,"), so scan back from "calls," for the
            # nearest count rather than matching either format. tr -d '\r'
            # because a Windows checkout makes the guards emit CRLF on stdout.
            if ! tr -d '\r' < authority-one.log \
                 | awk '/calls,/ { for (i = 1; i <= NF; i++)
                       if ($i ~ /calls,$/)
                         for (j = i - 1; j >= 1; j--)
                           if ($j ~ /^[0-9]+$/) { if ($j + 0 > 0) found = 1; break }
                     } END { exit !found }'; then
              echo "::error::$g reported no non-zero call count; it examined nothing"
              rc=1
            fi
          done
          cat authority.log
          exit $rc

      - name: Upload authority log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authority-guards
          path: authority.log
          retention-days: 14